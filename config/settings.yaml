# Application settings - all tunables live here (single source of truth besides the filter registry).

app:
  name: "ScreenerDesk"                # our own working title; no Tickertape branding anywhere
  host: 127.0.0.1
  port: 8787

# Non-negotiable #4: benchmarks (sector PE, percentile ranks, scores) use the FULL listed market;
# filtering/sorting uses the ACTIVE universe (user's Excel list).
benchmark_scope: "market"             # market | universe

data:
  raw_dir: "data/raw"                 # untouched official files, cached on disk
  parquet_cache: "data/cache/parquet" # normalized staging layer
  db_path: "data/screener.db"         # DuckDB
  inbox_dir: "data/inbox"             # manual import drop zone
  processed_dir: "data/processed"     # inbox files archived after successful import

scheduler:
  timezone: "Asia/Kolkata"
  eod_job_cron: "30 6 * * *"          # daily 06:30 IST: previous day's bhavcopies + corporate actions
  weekly_job_cron: "15 7 * * 6"       # Saturdays: masters, index constituents, AMFI check
  quarterly_job_cron: "0 8 10 1,4,7,10 *" # 10th of each quarter month: filings/shareholding (step 7)
  auto_sync: true                     # run jobs automatically when server starts; set false for strict offline

ingest:
  backfill_lookback_business_days: 7  # daily job walks back to first missing published file
  series_equity_nse: ["EQ"]           # equity mainline series kept for the screener
  series_equity_bse: ["A", "B", "T", "M", "MT", "XT", "Z", "P", "E", "EA", "EB", "EF", "EG", "EZ"]  # BSE equity-ish series; conservative keep, relaxed in step 3
  exclude_status: ["delisted"]        # never show delisted

universe_excel:                       # step 5
  fuzzy_match_threshold: 88           # 0-100 for name fuzzy matching (rapidfuzz at step 5)
  match_order: [isin, nse_symbol, bse_code, normalized_name, fuzzy_name]

filters:
  winsorize_pcts: [0.5, 99.5]         # slider display bounds only; inputs accept any value (step 4)
  default_page_size: 20

presets:
  # Market Cap presets come from AMFI classification (Large=1-100, Mid=101-250, Small=251+).
  mc_presets_source: "amfi"
  # Other metrics: tertiles of the ACTIVE universe's non-null values unless overridden in presets override file.
  preset_method: "tertiles_universe"

rates:
  fbil_mibor_3m_manual_file: "data/inbox/fbil_mibor.json"  # {"as_of": "2026-10-24", "rate_pct": "x.xx"}
